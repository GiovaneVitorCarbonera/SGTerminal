version: '3.9'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sgterminal
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5051:5432'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: sgterminal
      DB_PORT: 5432
      JWTSecret: supersecret
      PORT: 8080
    ports:
      - '8080:8080'
    volumes:
      - .:/app:cached
      - /app/node_modules
    command: npm start
